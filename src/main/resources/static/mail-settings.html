<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>邮箱配置 | 一分钟科技</title>
    <meta name="description" content="发件身份和 SMTP 配置。" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="site-body">
    <header class="system-header">
      <a class="back-link" href="/">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
        返回首页
      </a>

      <div class="brand-label" style="margin-right: auto;">
        <strong>系统配置</strong>
        <span>邮箱与发件服务中心</span>
      </div>

      <div class="locale-switch" aria-label="语言切换">
        <button type="button" class="is-active" data-locale="zh-CN">中文</button>
        <button type="button" data-locale="en">EN</button>
      </div>
    </header>

    <main class="system-page">
      <div class="settings-shell">
        <aside class="settings-sidebar">
          <div class="settings-nav-group">
            <h3>AI 模型</h3>
            <a class="settings-link" data-settings-path="/ai-settings" href="/ai-settings">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2 4 6v12l8 4 8-4V6l-8-4Zm0 2.2 5.8 2.9L12 10 6.2 7.1 12 4.2Zm-6 4.7 5 2.5v6.4l-5-2.5V8.9Zm7 8.9v-6.4l5-2.5v6.4l-5 2.5Z" />
              </svg>
              模型配置
            </a>
          </div>

          <div class="settings-nav-group">
            <h3>搜索引擎</h3>
            <a class="settings-link" data-settings-path="/crawler-settings" href="/crawler-settings">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="m20 20-4.2-4.2"></path>
              </svg>
              搜索 API
            </a>
            <a class="settings-link" data-settings-path="/crawler-rules" href="/crawler-rules">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 3 4 7v5c0 5.25 3.44 10.23 8 11 4.56-.77 8-5.75 8-11V7l-8-4Z" />
              </svg>
              爬虫配置
            </a>
          </div>

          <div class="settings-nav-group">
            <h3>邮件服务</h3>
            <a class="settings-link" data-settings-path="/mail-settings" href="/mail-settings">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M3 6.75A2.75 2.75 0 0 1 5.75 4h12.5A2.75 2.75 0 0 1 21 6.75v10.5A2.75 2.75 0 0 1 18.25 20H5.75A2.75 2.75 0 0 1 3 17.25V6.75Zm2.14.43L12 12.02l6.86-4.84A1.24 1.24 0 0 0 17.88 6H6.12a1.24 1.24 0 0 0-.98 1.18Z" />
              </svg>
              邮箱配置
            </a>
          </div>

          <div class="settings-nav-group">
            <h3>系统</h3>
            <a class="settings-link" data-settings-path="/general-settings" href="/general-settings">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M19.43 12.98 21.46 11.4a.65.65 0 0 0 .15-.82l-1.92-3.32a.65.65 0 0 0-.78-.29l-2.39.96a7.2 7.2 0 0 0-.83-.48l-.36-2.54a.66.66 0 0 0-.65-.55h-3.84a.66.66 0 0 0-.65.55l-.36 2.54c-.29.13-.56.29-.83.48l-2.39-.96a.65.65 0 0 0-.78.29L2.38 10.58a.65.65 0 0 0 .15.82l2.03 1.58-.04.48.04.48-2.03 1.58a.65.65 0 0 0-.15.82l1.92 3.32c.17.29.52.41.83.29l2.39-.96c.27.19.54.35.83.48l.36 2.54c.05.32.32.55.65.55h3.84c.33 0 .6-.23.65-.55l.36-2.54c.29-.13.56-.29.83-.48l2.39.96c.31.12.66 0 .83-.29l1.92-3.32a.65.65 0 0 0-.15-.82l-2.03-1.58.04-.48-.04-.48ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z" />
              </svg>
              通用设置
            </a>
          </div>
        </aside>

        <section class="settings-main">
          <div class="settings-hero">
            <h1>邮箱配置</h1>
            <p>保存这里的配置后，开发信页默认发件人和发送接口中的默认邮箱身份会同步变化。</p>
          </div>

          <form id="mail-settings-form" class="settings-stack">
            <article class="setting-section">
              <div class="settings-section-head">
                <div class="section-title-row">
                  <span class="section-icon">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <path d="M3 6.75A2.75 2.75 0 0 1 5.75 4h12.5A2.75 2.75 0 0 1 21 6.75v10.5A2.75 2.75 0 0 1 18.25 20H5.75A2.75 2.75 0 0 1 3 17.25V6.75Zm2.14.43L12 12.02l6.86-4.84A1.24 1.24 0 0 0 17.88 6H6.12a1.24 1.24 0 0 0-.98 1.18Z" />
                    </svg>
                  </span>
                  <div>
                    <h2 class="settings-section-title">发件身份</h2>
                    <p class="summary-copy">配置真正用于发送开发信的默认身份。</p>
                  </div>
                </div>
              </div>
              <div class="setting-body">
                <div class="setting-field-grid">
                  <label class="input-group">
                    <span>发件人姓名</span>
                    <input class="text-input" id="mail-sender-name" type="text" value="Zijian" />
                  </label>
                  <label class="input-group">
                    <span>发件邮箱</span>
                    <input class="text-input" id="mail-sender-email" type="email" value="zijian@example.com" />
                  </label>
                  <label class="input-group">
                    <span>回复邮箱</span>
                    <input class="text-input" id="mail-reply-to-email" type="email" value="reply@example.com" />
                  </label>
                  <label class="input-group">
                    <span>默认签名</span>
                    <input class="text-input" id="mail-signature" type="text" value="Zijian | LeadFlow Studio" />
                  </label>
                </div>
              </div>
            </article>

            <article class="setting-section">
              <div class="settings-section-head">
                <div class="section-title-row">
                  <span class="section-icon">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <path d="M4 4h16v5H4zm0 7h16v9H4zm3 2h4v5H7z" />
                    </svg>
                  </span>
                  <div>
                    <h2 class="settings-section-title">SMTP 服务</h2>
                    <p class="summary-copy">为后续接入真实发送保留参数。</p>
                  </div>
                </div>
              </div>
              <div class="setting-body">
                <div class="setting-field-grid">
                  <label class="input-group">
                    <span>服务商</span>
                    <select class="select-input" id="mail-smtp-provider">
                      <option value="Custom SMTP">Custom SMTP</option>
                      <option value="Gmail">Gmail</option>
                      <option value="Outlook">Outlook</option>
                      <option value="Tencent Mail">Tencent Mail</option>
                      <option value="Alibaba Mail">Alibaba Mail</option>
                    </select>
                  </label>
                  <label class="input-group">
                    <span>SMTP 主机</span>
                    <input class="text-input" id="mail-smtp-host" type="text" value="smtp.example.com" />
                  </label>
                  <label class="input-group">
                    <span>端口</span>
                    <input class="text-input" id="mail-smtp-port" type="number" min="1" value="587" />
                  </label>
                  <label class="input-group">
                    <span>安全方式</span>
                    <select class="select-input" id="mail-smtp-security">
                      <option value="TLS">TLS</option>
                      <option value="STARTTLS">STARTTLS</option>
                      <option value="SSL">SSL</option>
                    </select>
                  </label>
                  <label class="input-group">
                    <span>SMTP 用户名</span>
                    <input class="text-input" id="mail-smtp-username" type="text" value="zijian@example.com" />
                  </label>
                  <label class="input-group">
                    <span>SMTP 密码 / 授权码</span>
                    <input class="text-input" id="mail-smtp-password" type="password" value="" />
                  </label>
                </div>
              </div>
            </article>

            <article class="setting-section">
              <div class="settings-section-head">
                <div class="section-title-row">
                  <span class="section-icon">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <path d="M11 2h2v8h-2zm0 12h2v2h-2zm-5-5h2v7H6zm10 0h2v7h-2z" />
                    </svg>
                  </span>
                  <div>
                    <h2 class="settings-section-title">发送规则</h2>
                    <p class="summary-copy">限制默认发送节奏。</p>
                  </div>
                </div>
              </div>
              <div class="setting-body">
                <div class="setting-field-grid">
                  <label class="input-group">
                    <span>单次批量上限</span>
                    <input class="text-input" id="mail-batch-limit" type="number" min="1" value="50" />
                  </label>
                  <label class="input-group">
                    <span>每小时上限</span>
                    <input class="text-input" id="mail-hourly-limit" type="number" min="1" value="120" />
                  </label>
                  <label class="input-group">
                    <span>失败重试次数</span>
                    <input class="text-input" id="mail-retry-count" type="number" min="0" value="2" />
                  </label>
                  <label class="input-group">
                    <span>发送模式</span>
                    <select class="select-input" id="mail-send-mode">
                      <option value="demo">演示发送</option>
                      <option value="smtp">SMTP 发送</option>
                    </select>
                  </label>
                </div>
              </div>
              <div class="footer-actions right">
                <div id="mail-settings-result" class="helper-note"></div>
                <button class="action-button orange" type="submit">保存配置</button>
              </div>
            </article>
          </form>
        </section>
      </div>
    </main>

    <script src="/main.js?v=4"></script>
    <script src="/settings.js?v=3"></script>
  </body>
</html>
